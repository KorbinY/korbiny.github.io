short_bio: >-
  <p>
    I am a Ph.D. student (since 2022) in Computer Science at Michigan State University.
    My research interests include <strong>Large Language Models (LLMs)</strong>,
    <strong>Computational Social Science</strong>, and <strong>AI for Education</strong>,
    with a particular focus on developing reasoning methods and evaluating LLMs in real-world social and educational settings.
  </p>

  <p>
    Prior to my Ph.D., I obtained a Master’s degree in Applied Statistics (Data Science) and a B.A. in Sociology from Fudan University, China.
  </p>

  <p>
    I will be on the job market in <span style="color:#FF7F50; font-weight:bold;">Spring 2027</span> and am actively seeking
    <span style="color:#FF7F50; font-weight:bold;">industry positions</span>,
    particularly in areas related to social computing, dialogue systems, and user modeling.
    Potential opportunities and collaborations are always welcome.
    Please feel free to reach out via any of the contact methods listed below.
    You can also view my
    <a href="/cv" class="btn btn-sm btn-secondary-deep align-baseline">
      <i class="fa-solid fa-id-card"></i>
      <span class="cv-text">&nbsp;CV&nbsp;</span>
    </a>.
  </p>


